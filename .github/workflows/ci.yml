name: CI

on:
  push:
    branches: [main, deploy-postgres]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_splitter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/expense_splitter?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/expense_splitter?schema=public"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/expense_splitter_test?schema=public"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci # runs `postinstall` -> `prisma generate`
      - run: PGPASSWORD=postgres createdb -h localhost -U postgres expense_splitter_test
      - run: npx prisma migrate deploy # apply migrations to the app database
      - run: npm run check # tsc --noEmit && eslint && vitest run
      - run: npx next build # build only; `npm run build` also runs migrate deploy
